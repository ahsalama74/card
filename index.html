<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ahmed Salama | Founder &amp; CEO, Talin</title>
  <meta name="description" content="Ahmed Salama, Founder &amp; CEO of Talin, by CID Consulting. AI and data advisory, Cairo, Egypt. Save contact, call, WhatsApp, email or connect on LinkedIn.">
  <meta name="theme-color" content="#000940">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="https://card.talindata.com/">

  <!-- Link previews (WhatsApp, LinkedIn, iMessage, Slack). Absolute URLs are required here.
       If the card moves to another address, update the three URLs below. -->
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Talin">
  <meta property="og:title" content="Ahmed Salama | Founder &amp; CEO, Talin">
  <meta property="og:description" content="Digital business card. Save contact, call, WhatsApp, email or connect on LinkedIn.">
  <meta property="og:url" content="https://card.talindata.com/">
  <meta property="og:image" content="https://card.talindata.com/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Talin, by CID Consulting">
  <meta property="profile:first_name" content="Ahmed">
  <meta property="profile:last_name" content="Salama">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ahmed Salama | Founder &amp; CEO, Talin">
  <meta name="twitter:description" content="Digital business card. Save contact, call, WhatsApp, email or connect on LinkedIn.">
  <meta name="twitter:image" content="https://card.talindata.com/assets/og-image.jpg">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" as="image" href="assets/hero-bg.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#actions">Skip to actions</a>

  <main class="card" id="top">

    <header class="hero">
      <img class="hero__logo" src="assets/talin-logo-white.png" width="148" height="58" alt="Talin, by CID Consulting">

      <div class="hero__id">
        <div class="avatar" id="avatar">
          <img id="avatar-img" src="assets/ahmed-salama.jpg" width="120" height="120" alt="Portrait of Ahmed Salama" decoding="async">
          <span class="avatar__fallback" aria-hidden="true">AS</span>
        </div>
        <h1 class="hero__name" data-bind="name">Ahmed Salama</h1>
        <p class="hero__title" data-bind="title">Founder &amp; CEO</p>
        <p class="hero__meta"><span data-bind="company">Talin</span><span class="sep" aria-hidden="true"></span><span data-bind="location">Cairo, Egypt</span></p>
      </div>
    </header>

    <section class="sheet" id="actions" aria-label="Contact actions">

      <a class="btn btn--primary" id="save-contact" href="ahmed-salama.vcf" type="text/vcard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm-9.5 11c.6-3.3 3.3-5 6.5-5s5.900 1.700 6.500 5M19 5v5m-2.500-2.500h5" /></svg>
        Save Contact
      </a>

      <ul class="tiles" id="tiles">
        <li data-field="phone"><a class="tile" id="act-call" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
          <span>Call</span></a></li>
        <li data-field="whatsapp"><a class="tile" id="act-whatsapp" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.300-4.100A8 8 0 1 1 8.200 18.800L4 20Z"/><path d="M9.500 9c.3 2.200 2.300 4.200 4.800 5l1.200-1.300-1.800-1-.9.600c-.9-.4-1.600-1.100-2-2l.6-.9-1-1.800L9.500 9Z"/></svg>
          <span>WhatsApp</span></a></li>
        <li data-field="email"><a class="tile" id="act-email" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.500 7 8.500 6 8.500-6"/></svg>
          <span>Email</span></a></li>
        <li data-field="linkedin"><a class="tile" id="act-linkedin" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.500V16M8 7.500v.01M12 16v-5.500m0 2.500c0-1.500 1-2.600 2.400-2.600S17 11.500 17 13v3"/></svg>
          <span>LinkedIn</span></a></li>
        <li data-field="website"><a class="tile" id="act-website" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.500 2.600 3.800 5.600 3.800 9S14.500 18.400 12 21c-2.500-2.600-3.800-5.600-3.800-9S9.500 5.600 12 3Z"/></svg>
          <span>Website</span></a></li>
        <li><button class="tile" id="act-share" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
          <span>Share</span></button></li>
      </ul>

      <dl class="details" id="details">
        <div data-field="email"><dt>Email</dt><dd><a id="d-email" href="#"></a></dd></div>
        <div data-field="phone"><dt>Mobile</dt><dd><a id="d-phone" href="#"></a></dd></div>
        <div data-field="website"><dt>Website</dt><dd><a id="d-website" href="#" target="_blank" rel="noopener"></a></dd></div>
        <div data-field="location"><dt>Location</dt><dd data-bind="location">Cairo, Egypt</dd></div>
      </dl>

      <section class="qr" aria-labelledby="qr-title">
        <h2 id="qr-title">Scan to open this card</h2>
        <div class="qr__frame" id="qr" role="img" aria-label="QR code that opens Ahmed Salama's digital business card"></div>
        <div class="qr__actions">
          <button class="btn btn--ghost" id="qr-png" type="button">Download PNG</button>
          <button class="btn btn--ghost" id="qr-svg" type="button">Download SVG</button>
        </div>
        <label class="qr__opt"><input type="checkbox" id="qr-icon" checked> Talin icon in the center</label>
        <p class="qr__note">PNG for presentations. SVG for print.</p>
      </section>

    </section>

    <footer class="foot">Talin, by CID Consulting</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">JavaScript is off. <a href="ahmed-salama.vcf">Save contact</a> or email <a href="mailto:ahsalama@talindata.com">ahsalama@talindata.com</a>.</p></noscript>

  <script src="config.js"></script>
  <script src="assets/js/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
